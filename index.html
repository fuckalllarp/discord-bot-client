<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotCord Pro | Discord Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .message-hover:hover { background-color: #2e3035; }
        .emoji-btn:hover { transform: scale(1.2); }
        #chat-messages { scroll-behavior: smooth; }
        .proxy-active { color: #f23f42; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-overlay" class="fixed inset-0 bg-[#1e1f22] z-[100] flex items-center justify-center p-4">
        <div class="bg-[#313338] p-8 rounded-lg shadow-2xl w-full max-w-md border border-[#ffffff0a]">
            <div class="text-center mb-8">
                <i class="fa-brands fa-discord text-5xl text-[#5865f2] mb-4"></i>
                <h1 class="text-2xl font-bold text-white">Bot Management</h1>
                <p class="text-[#b5bac1] text-sm">Enter your bot token to start spying—err, managing.</p>
            </div>
            
            <label class="text-xs font-bold text-[#b5bac1] uppercase mb-2 block">Bot Token</label>
            <input type="password" id="bot-token" class="w-full p-3 bg-[#1e1f22] rounded border-none focus:ring-2 focus:ring-[#5865f2] mb-4 text-white outline-none" placeholder="OTk0...">
            
            <div class="flex items-center mb-6 bg-[#2b2d31] p-3 rounded">
                <input type="checkbox" id="use-proxy" class="w-4 h-4 text-[#5865f2] rounded border-none focus:ring-0">
                <label for="use-proxy" class="ml-3 text-sm text-[#dbdee1]">Use CORS Proxy (Required for iOS/Web)</label>
            </div>

            <button onclick="initConnection()" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white py-3 rounded font-bold transition-all shadow-lg">Login</button>
        </div>
    </div>

    <!-- SIDEBAR: SERVERS -->
    <nav class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 overflow-y-auto no-scrollbar flex-shrink-0">
        <div class="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white transition-all cursor-pointer group mb-1">
            <i class="fa-brands fa-discord text-2xl"></i>
        </div>
        <div class="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto"></div>
        <div id="server-list" class="flex flex-col space-y-2 py-2">
            <!-- Servers appear here -->
        </div>
    </nav>

    <!-- SIDEBAR: CHANNELS -->
    <aside class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
        <header class="h-12 flex items-center px-4 border-b border-[#1f2124] shadow-sm">
            <h2 id="current-server-name" class="font-bold text-white truncate text-sm">Select a Server</h2>
        </header>
        <div id="channel-list" class="flex-1 overflow-y-auto p-2 space-y-[2px]">
            <!-- Channels appear here -->
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#313338]">
        <header class="h-12 flex items-center justify-between px-4 border-b border-[#1f2124] shadow-sm flex-shrink-0">
            <div class="flex items-center font-bold text-white">
                <i class="fa-solid fa-hashtag text-[#80848e] mr-2 text-xl"></i>
                <span id="current-channel-name" class="truncate">Select Channel</span>
            </div>
        </header>

        <!-- MESSAGES -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-1">
            <div class="text-center text-[#949ba4] mt-20">
                <i class="fa-solid fa-comments text-5xl mb-4 opacity-20"></i>
                <p>Welcome to the beginning of the channel history.</p>
            </div>
        </div>

        <!-- INPUT BOX -->
        <footer class="px-4 pb-6">
            <div id="emoji-tray" class="hidden flex-wrap gap-2 p-3 bg-[#2b2d31] border border-[#1f2124] rounded-t-lg">
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('😀')">😀</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('😂')">😂</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('😍')">😍</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('🔥')">🔥</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('👍')">👍</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('💀')">💀</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('💯')">💯</span>
                <span class="emoji-btn cursor-pointer text-xl" onclick="addEmoji('✨')">✨</span>
            </div>
            <div class="bg-[#383a40] rounded-lg flex items-center p-2 shadow-inner">
                <button onclick="toggleEmoji()" class="p-2 text-[#b5bac1] hover:text-white transition">
                    <i class="fa-solid fa-face-smile text-xl"></i>
                </button>
                <input type="text" id="msg-input" class="bg-transparent flex-1 px-2 text-[#dbdee1] outline-none placeholder-[#949ba4]" placeholder="Select a channel first...">
                <button onclick="sendMessage()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white px-4 py-2 rounded-md font-bold text-sm transition flex items-center">
                    <span class="hidden sm:inline mr-2">Send</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <script>
        let TOKEN = "";
        let ACTIVE_GUILD = "";
        let ACTIVE_CHAN = "";
        let PROXY = "";

        // API Helper to handle Proxy + Headers
        async function api(path, method = "GET", body = null) {
            const url = `${PROXY}https://discord.com/api/v10${path}`;
            const options = {
                method,
                headers: { "Authorization": `Bot ${TOKEN}`, "Content-Type": "application/json" }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return res.json();
        }

        function initConnection() {
            TOKEN = document.getElementById('bot-token').value.trim();
            const useProxy = document.getElementById('use-proxy').checked;
            // Public CORS proxy - Visit https://cors-anywhere.herokuapp.com/corsdemo to activate if it fails
            PROXY = useProxy ? "https://cors-anywhere.herokuapp.com/" : "";
            
            api('/users/@me').then(data => {
                document.getElementById('login-overlay').style.display = 'none';
                loadGuilds();
            }).catch(err => alert("Connection Failed! Try turning on the Proxy or check your token."));
        }

        async function loadGuilds() {
            try {
                const guilds = await api('/users/@me/guilds');
                const list = document.getElementById('server-list');
                list.innerHTML = guilds.map(g => `
                    <div onclick="loadChannels('${g.id}', '${g.name.replace(/'/g, "")}')" 
                         class="w-12 h-12 bg-[#313338] text-white rounded-[24px] flex items-center justify-center server-icon overflow-hidden hover:rounded-[16px] hover:bg-[#5865f2] transition-all cursor-pointer">
                        ${g.icon ? `<img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png" class="w-full h-full">` : g.name[0]}
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function loadChannels(id, name) {
            ACTIVE_GUILD = id;
            document.getElementById('current-server-name').innerText = name;
            try {
                const channels = await api(`/guilds/${id}/channels`);
                const list = document.getElementById('channel-list');
                // Type 0 = Text, Type 5 = Announcement
                const textChans = channels.filter(c => c.type === 0 || c.type === 5);
                list.innerHTML = textChans.map(c => `
                    <div onclick="setChannel('${c.id}', '${c.name}')" class="p-2 rounded hover:bg-[#35373c] text-[#8e9297] hover:text-[#dbdee1] cursor-pointer flex items-center group">
                        <i class="fa-solid fa-hashtag mr-2 text-[#80848e]"></i> ${c.name}
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function setChannel(id, name) {
            ACTIVE_CHAN = id;
            document.getElementById('current-channel-name').innerText = name;
            document.getElementById('msg-input').placeholder = `Message #${name}`;
            fetchMessages();
        }

        async function fetchMessages() {
            if (!ACTIVE_CHAN) return;
            try {
                const msgs = await api(`/channels/${ACTIVE_CHAN}/messages?limit=50`);
                const chat = document.getElementById('chat-messages');
                chat.innerHTML = msgs.reverse().map(m => `
                    <div class="flex px-1 py-1 message-hover rounded">
                        <img src="https://cdn.discordapp.com/embed/avatars/${parseInt(m.author.discriminator) % 5}.png" class="w-10 h-10 rounded-full mr-4 mt-1">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-baseline space-x-2">
                                <span class="font-bold text-white text-sm hover:underline cursor-pointer">${m.author.username}</span>
                                <span class="text-[10px] text-[#949ba4]">${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <div class="text-[#dbdee1] text-sm break-words">${m.content || '<span class="text-xs text-gray-500 italic">No text content</span>'}</div>
                        </div>
                    </div>
                `).join('');
                chat.scrollTop = chat.scrollHeight;
            } catch(e) { console.error(e); }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content || !ACTIVE_CHAN) return;

            input.value = "";
            try {
                await api(`/channels/${ACTIVE_CHAN}/messages`, "POST", { content });
                fetchMessages();
            } catch(e) { alert("Failed to send message!"); }
        }

        // UI Handlers
        function toggleEmoji() {
            const tray = document.getElementById('emoji-tray');
            tray.classList.toggle('hidden');
        }

        function addEmoji(emoji) {
            document.getElementById('msg-input').value += emoji;
            toggleEmoji();
            document.getElementById('msg-input').focus();
        }

        // Key Listeners
        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Polling for new messages (Every 4 seconds)
        setInterval(fetchMessages, 4000);
    </script>
</body>
</html>
