<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BotCord | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <div id="login-screen" class="fixed inset-0 bg-[#1e1f22] z-[100] flex items-center justify-center p-4">
        <div class="bg-[#313338] p-6 rounded-lg w-full max-w-sm shadow-2xl text-center">
            <i class="fa-brands fa-discord text-4xl text-[#5865f2] mb-4"></i>
            <h1 class="text-xl font-bold mb-4 text-white">Bot Login</h1>
            <input type="password" id="token-input" class="w-full p-3 bg-[#1e1f22] rounded mb-4 outline-none text-white border border-transparent focus:border-[#5865f2]" placeholder="Bot Token">
            <button id="login-btn" class="w-full bg-[#5865f2] hover:bg-[#4752c4] p-3 rounded font-bold text-white transition">Connect</button>
            <div id="login-status" class="mt-4 text-xs text-red-500 font-medium"></div>
        </div>
    </div>

    <nav class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0 overflow-y-auto no-scrollbar">
        <div id="guild-list" class="space-y-2"></div>
    </nav>

    <aside class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
        <div id="guild-name" class="h-12 border-b border-black/20 flex items-center px-4 font-bold text-sm text-white truncate">Select Server</div>
        <div id="chan-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#313338] min-w-0">
        <header class="h-12 border-b border-black/20 flex items-center px-4 font-bold shadow-sm">
            <span class="text-gray-500 mr-2 text-xl">#</span> 
            <span id="chan-name" class="text-white">select-channel</span>
        </header>
        
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="text-center text-gray-500 mt-20 italic">No messages to show.</div>
        </div>
        
        <footer class="p-4">
            <div class="bg-[#383a40] rounded-lg flex items-center p-2">
                <input type="text" id="msg-input" class="bg-transparent flex-1 px-2 outline-none text-sm text-white" placeholder="Message...">
                <button id="send-btn" class="text-[#5865f2] px-3 font-bold hover:text-white transition">SEND</button>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
