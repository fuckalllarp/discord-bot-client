<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotCord | Discord Bot Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #313338; color: #dbdee1; overflow: hidden; }
        .server-icon { transition: border-radius 0.2s; cursor: pointer; }
        .server-icon:hover { border-radius: 16px; background-color: #5865f2; color: white; }
        .active-server { border-radius: 16px; background-color: #5865f2; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-[#313338] z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-[#2b2d31] p-8 rounded-lg shadow-xl w-full max-w-md">
            <h1 class="text-2xl font-bold text-white mb-2">Welcome back!</h1>
            <p class="text-[#b5bac1] mb-6">Login with your Discord Bot Token</p>
            <input type="password" id="bot-token" class="w-full p-3 bg-[#1e1f22] rounded border-none focus:ring-2 focus:ring-[#5865f2] mb-4 text-white" placeholder="Bot Token">
            <button onclick="login()" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white py-3 rounded font-medium transition">Login</button>
            <p class="mt-4 text-xs text-[#949ba4]">This client is client-side only. Your token is never stored.</p>
        </div>
    </div>

    <!-- MAIN INTERFACE (Hidden until login) -->
    <!-- Sidebar: Servers -->
    <nav class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 overflow-y-auto no-scrollbar">
        <div class="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white transition-all cursor-pointer group">
            <i class="fa-brands fa-discord text-2xl"></i>
        </div>
        <div class="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto my-1"></div>
        <div id="server-list" class="flex flex-col space-y-2">
            <!-- Servers injected here -->
        </div>
    </nav>

    <!-- Sidebar: Channels -->
    <aside class="w-60 bg-[#2b2d31] flex flex-col">
        <header class="h-12 shadow-sm flex items-center px-4 border-b border-[#1f2124]">
            <h2 id="current-server-name" class="font-bold text-white truncate">Select Server</h2>
        </header>
        <div id="channel-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Channels injected here -->
        </div>
    </aside>

    <!-- Main Content: Chat -->
    <main class="flex-1 flex flex-col bg-[#313338]">
        <header class="h-12 shadow-sm flex items-center px-4 border-b border-[#1f2124] text-white font-semibold">
            <span class="text-[#80848e] mr-2">#</span> <span id="current-channel-name">general</span>
        </header>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages injected here -->
        </div>

        <footer class="p-4">
            <div class="bg-[#383a40] rounded-lg flex items-center px-4 py-2">
                <input type="text" id="message-input" class="bg-transparent w-full text-[#dbdee1] focus:outline-none" placeholder="Message #general">
            </div>
        </footer>
    </main>

    <script>
        let botToken = "";
        let selectedChannel = "";

        async function login() {
            const input = document.getElementById('bot-token');
            botToken = input.value.trim();
            
            try {
                const res = await fetch('https://discord.com/api/v10/users/@me', {
                    headers: { 'Authorization': `Bot ${botToken}` }
                });
                if (!res.ok) throw new Error("Invalid Token");
                
                document.getElementById('login-overlay').classList.add('hidden');
                loadServers();
            } catch (e) {
                alert("Login failed! Ensure the token is a BOT token and has correct intents.");
            }
        }

        async function loadServers() {
            const res = await fetch('https://discord.com/api/v10/users/@me/guilds', {
                headers: { 'Authorization': `Bot ${botToken}` }
            });
            const guilds = await res.json();
            const list = document.getElementById('server-list');
            list.innerHTML = guilds.map(g => `
                <div onclick="loadChannels('${g.id}', '${g.name.replace(/'/g, "\\'")}')" class="w-12 h-12 bg-[#313338] text-[#dbdee1] rounded-[24px] flex items-center justify-center server-icon overflow-hidden">
                    ${g.icon ? `<img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png" class="w-full h-full object-cover">` : g.name[0]}
                </div>
            `).join('');
        }

        async function loadChannels(guildId, guildName) {
            document.getElementById('current-server-name').innerText = guildName;
            const res = await fetch(`https://discord.com/api/v10/guilds/${guildId}/channels`, {
                headers: { 'Authorization': `Bot ${botToken}` }
            });
            const channels = await res.json();
            const list = document.getElementById('channel-list');
            
            // Only show text channels
            const textChannels = channels.filter(c => c.type === 0);
            list.innerHTML = textChannels.map(c => `
                <div onclick="selectChannel('${c.id}', '${c.name}')" class="p-2 rounded hover:bg-[#35373c] text-[#8e9297] hover:text-[#dbdee1] cursor-pointer flex items-center">
                    <span class="text-xl mr-2 text-[#80848e]">#</span> ${c.name}
                </div>
            `).join('');
        }

        async function selectChannel(id, name) {
            selectedChannel = id;
            document.getElementById('current-channel-name').innerText = name;
            document.getElementById('message-input').placeholder = `Message #${name}`;
            loadMessages();
        }

        async function loadMessages() {
            if (!selectedChannel) return;
            const res = await fetch(`https://discord.com/api/v10/channels/${selectedChannel}/messages?limit=50`, {
                headers: { 'Authorization': `Bot ${botToken}` }
            });
            const msgs = await res.json();
            const chat = document.getElementById('chat-messages');
            chat.innerHTML = msgs.reverse().map(m => `
                <div class="flex items-start space-x-4">
                    <img src="https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" class="w-10 h-10 rounded-full">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-white">${m.author.username}</span>
                            <span class="text-xs text-[#949ba4]">${new Date(m.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <p class="text-[#dbdee1]">${m.content}</p>
                    </div>
                </div>
            `).join('');
            chat.scrollTop = chat.scrollHeight;
        }

        // Send Message Handler
        document.getElementById('message-input').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && selectedChannel) {
                const content = e.target.value;
                e.target.value = '';
                await fetch(`https://discord.com/api/v10/channels/${selectedChannel}/messages`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bot ${botToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });
                loadMessages();
            }
        });

        // Refresh messages every 3 seconds (Simulated real-time)
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
